<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>243 · Auto‑Roll Runtime</title>

<style>
body{background:#000;color:#0f0;font-family:monospace;padding:40px;}
.block{background:#111;padding:20px;margin-bottom:20px;border-radius:6px;}
pre{background:#111;border-left:3px solid #6cf;padding:15px;white-space:pre-wrap;}
button{background:#111;color:#0f0;border:1px solid #333;padding:10px 20px;margin-top:10px;}
h1{color:#6cf;}
</style>
</head>

<body>

<h1>243 · Auto‑Roll Runtime Engine</h1>

<div class="block">
    <button onclick="startAutoRoll()">Auto‑Roll starten</button>
    <button onclick="stopAutoRoll()">Stop</button>
    <pre id="out">Bereit…</pre>
</div>

<script type="module">

// ─────────────────────────────────────────────
// ROLL‑SYSTEM LADEN
// ─────────────────────────────────────────────
import run100 from "./100.js";
import run150 from "./150.js";
import run200 from "./200.js";
import run50 from "./50.js";

// Saubere Zuordnung
const ROLL = {
    basic: run100,
    opt: run150,
    safe: run200,
    multi: run50
};

// Reihenfolge für Auto‑Roll
const ORDER = ["basic", "opt", "safe", "multi"];

let index = 0;
let interval = null;

// ─────────────────────────────────────────────
// AUTO‑ROLL START
// ─────────────────────────────────────────────
window.startAutoRoll = function () {

    if (interval) return; // schon aktiv

    interval = setInterval(() => {

        const mode = ORDER[index];
        const fn = ROLL[mode];

        const result = fn();   // Funktion ausführen
        const out = document.getElementById("out");

        out.textContent =
            `Modus: ${mode}\n\n` +
            JSON.stringify(result, null, 2);

        console.log("Auto‑Roll:", mode, result);

        index = (index + 1) % ORDER.length;

    }, 1000); // jede Sekunde
};

// ─────────────────────────────────────────────
// AUTO‑ROLL STOP
// ─────────────────────────────────────────────
window.stopAutoRoll = function () {
    clearInterval(interval);
    interval = null;
    document.getElementById("out").textContent = "Gestoppt.";
};

</script>

</body>
</html>
