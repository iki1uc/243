<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>243 · Runtime · GEO‑Room</title>

<style>
body{background:#000;color:#0f0;font-family:monospace;padding:40px;}
.block{background:#111;padding:20px;margin-bottom:20px;border-radius:6px;}
.title{color:#6cf;font-size:20px;margin-bottom:10px;}
pre{background:#111;border-left:3px solid #6cf;padding:15px;white-space:pre-wrap;}
button{background:#111;color:#0f0;border:1px solid #333;padding:10px 20px;margin-top:10px;}
</style>
</head>

<body>

<h1>243 · Runtime Engine</h1>

<div class="block">
    <button onclick="run243()">243 starten</button>
    <pre id="out">Bereit…</pre>
</div>

<script type="module">

import { C81 } from "./81.room";
import { X_ROOM_IN } from "./X.room.IN";
import { X_ROOM_OUT } from "./X.room.OUT";
import { RESPO_Whirl } from "./RESPO_Whirl.js";
import { WHIRL_SYS } from "./WHIRL.SYS";
import { Operator9 } from "./9×9-Operator.me";
import { B_ROOM } from "./B.room";
import { Y_ROOM } from "./Y.room";

function run243(){

    const out = {

        c81: C81.init(),
        x_in: X_ROOM_IN,
        x_out: X_ROOM_OUT,
        respo_whirl: RESPO_Whirl,
        whirl_sys: WHIRL_SYS,
        operator9: Operator9,
        b_room: B_ROOM,
        y_room: Y_ROOM,

        timestamp: Date.now()
    };

    document.getElementById("out").textContent =
        JSON.stringify(out, null, 2);
}

</script>

</body>
</html>
